cognito.client-id=3tj5gt4kglobd8n7r3cqrb5in5
cognito.redirect-uri=http://localhost:8080/auth/callback
cognito.token-uri=https://eu-north-1lbrgh68wz.auth.eu-north-1.amazoncognito.com/oauth2/token
aws.region=eu-north-1


# Logging configuration
# logging.level.org.springframework.security=DEBUG
spring.output.ansi.enabled=ALWAYS 
logging.pattern.console=%d{HH:mm:ss} [%highlight(%-5level)] %logger{36} - %msg%n


# H2 FILE-BASED DB CONFIG
spring.datasource.url=jdbc:h2:file:./data/taskdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Keep schema and data between restarts
spring.jpa.hibernate.ddl-auto=update

# H2 console for development/testing
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Pagination configuration
spring.data.web.pageable.default-page-size=5
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.one-indexed-parameters=true
